# Authentication-only Dovecot configuration for Postfix SMTP submission.
# No IMAP/POP service is required.

auth_mechanisms = plain login
disable_plaintext_auth = yes

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/zp-submission-users
}

userdb {
  driver = static
  args = uid=nobody gid=nogroup home=/nonexistent
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
